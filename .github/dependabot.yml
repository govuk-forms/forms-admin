# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for Ruby/Rails bundler
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-name: "vite_ruby"
    # A dependency goes in the first group it matches, so order matters
    groups:
      # These gems must be bumped together. Minor and patch bumps fall through
      # to the groups below; only majors get their own PR here.
      sentry:
        patterns:
          - "sentry-*"
        update-types:
          - "major"
      vite_ruby:
        patterns:
          - "vite_rails"
          - "vite_ruby"
        update-types:
          - "major"
      # Rails minor upgrades get their own PR; patches go in bundler-production
      rails:
        patterns:
          - "rails"
        update-types:
          - "minor"
      # Gems in the :development and :test Gemfile groups
      bundler-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      bundler-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Maintain dependencies for npm
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: terraform
    directory: ".review_apps/"
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      terraform-all-dependencies:
        patterns:
          - "*"
    target-branch: main
